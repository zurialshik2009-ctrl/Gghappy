name: Test GDrive Upload
on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Create Test File
        run: |
          echo "This is a test file to verify Google Drive Upload" > test_file.txt
          echo "Upload Date: $(date)" >> test_file.txt

      - name: Upload Test File to Google Drive
        uses: adityak74/google-drive-upload-gitaction@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          filename: test_file.txt
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "true"
